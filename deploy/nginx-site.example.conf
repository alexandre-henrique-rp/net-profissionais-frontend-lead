# Exemplo de site para o Nginx DO SERVIDOR (não roda em container).
#
# Serve o build estático do frontend (gerado pelo deploy.sh na pasta build/).
#
# 1) Copie este bloco para /etc/nginx/sites-available/ (ou conf.d/) e ajuste:
#      - server_name
#      - root → caminho absoluto da pasta build/ gerada pelo deploy.sh
# 2) Habilite o site e rode: nginx -t && nginx -s reload
# 3) A API é um container único publicado na porta 3000 do host (o tráfego
#    público chega pelo Cloudflare Tunnel). Se quiser servir a API no mesmo
#    domínio, descomente o location /api/ abaixo.

server {
	listen 80;
	server_name app.seudominio.com.br;

	# Caminho absoluto da pasta build/ gerada por ./deploy.sh atualizar:
	root /opt/net-profissionais-frontend-lead/build;
	index index.html;

	# Assets com hash no nome (Vite): cache agressivo, seguro para imutáveis.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# SPA: qualquer rota que não seja arquivo existente cai no index.html,
	# que resolve o roteamento no cliente (TanStack Router).
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Sem cache no HTML para o deploy pegar efeito imediatamente.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	# Opcional: mesma origem para a API (evita CORS e o VITE_API_URL embutido).
	# location /api/ {
	# 	proxy_pass http://127.0.0.1:3000;
	# 	proxy_http_version 1.1;
	# 	proxy_set_header Host $host;
	# 	proxy_set_header X-Real-IP $remote_addr;
	# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	# 	proxy_set_header X-Forwarded-Proto $scheme;
	# }
}
