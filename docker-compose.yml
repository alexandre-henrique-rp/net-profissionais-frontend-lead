# Build do frontend entregue num volume compartilhado e servido pelo nginx.
#
#   docker compose up --build
#
# O serviço `frontend-build` instala, compila, copia o dist/ para o volume
# `frontend-dist` e termina. O `frontend-web` serve esse mesmo volume em
# http://localhost:8080. Para apontar a API de produção:
#
#   VITE_API_URL=https://api.seudominio.com.br/api/v1 docker compose up --build

services:
  frontend-build:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    volumes:
      - frontend-dist:/output

  frontend-web:
    image: nginx:1.27-alpine
    depends_on:
      frontend-build:
        condition: service_completed_successfully
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  frontend-dist:
