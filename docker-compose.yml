name: net-profissionais-frontend-lead

# Container único que serve o build SPA na porta PORTA (padrão 3001), sem
# proxy interno — quem encaminha o tráfego público é o Cloudflare Tunnel.
# O serve.mjs repassa /api/* ao serviço `api` do backend na rede Docker
# compartilhada, então o bundle pode usar caminho relativo (sem CORS).
services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: netprofissionais-frontend-build:latest
    container_name: netprofissional-frontend
    restart: unless-stopped
    environment:
      API_UPSTREAMS: ${API_UPSTREAMS:-http://api:3000}
    ports:
      - "${PORTA:-3001}:3001"
    networks:
      - api

networks:
  api:
    name: net-profissionais-backend-lead_api
    external: true
